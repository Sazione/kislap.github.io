<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <title>KISLAP | Innovator Quiz</title>
  </head>
  <body class="bg-gray-100 min-h-screen flex flex-col items-center">
    <!-- DYNAMIC NAVBAR - color changes with section -->
    <nav id="quiz-navbar" class="fixed top-0 left-0 w-full z-50 bg-amber-500 shadow-md transition-colors duration-300">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- top-left: LOGO + KISLAP TITLE -->
          <div class="flex items-center">
            <img src="assets/images/small logo final.png" alt="KISLAP" class="w-12 h-12 rounded-2xl bg-white object-cover shadow-sm">
            <!-- KISLAP title completely removed (logo already represents it) -->
          </div>
          
          <!-- top-right: HOME button -->
          <div>
            <a href="index.html" 
               class="inline-block bg-white text-black hover:bg-amber-50 font-semibold px-5 py-2 rounded-full shadow-md transition duration-200 border border-amber-200">
              🏠 HOME
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Add padding-top to account for fixed navbar -->
    <div class="pt-20 w-full flex flex-col items-center">
      <!-- Quiz Section Top Box -->
      <div id="section-box" class="max-w-2xl mx-auto p-8 bg-white rounded-lg shadow-md mb-8 flex items-center space-x-6">
        <img id="section-image" src="assets/images/logo.png" alt="Section Logo" class="w-20 h-20 object-cover rounded-lg">
        <div>
          <h2 class="text-3xl font-bold" id="section-title">Section 1</h2>
          <p class="text-gray-600 text-lg italic" id="section-fun-fact"></p>
        </div>
      </div>

      <!-- Quiz Questions Container -->
      <div id="questions-container" class="max-w-2xl w-full mx-auto p-8 bg-white rounded-lg shadow-lg mb-6">

        <div id="questions-list" class="space-y-6 mb-8"></div>
        
        <div class="flex justify-end">
          <button id="next-btn" class="px-8 py-4 text-white font-semibold rounded-lg shadow-md transition-all duration-200 hover:shadow-xl hover:scale-105">
            Complete Section & Continue →
          </button>
        </div>
      </div>
    </div>

    <!-- Load JavaScript files -->
    <script src="js/data/config.js"></script>
    <script src="js/data/questions.js"></script>
    <script src="js/utils/scroll.js"></script>
    <script src="js/utils/scoring.js"></script>
    <script src="js/components/likert.js"></script>
    <script src="js/components/results.js"></script>
    <script src="js/components/quizUI.js"></script>
    <script src="js/main.js"></script>
    
    <script>
      window.addEventListener('load', function() {
        if (typeof initQuiz === 'function') {
          initQuiz();
        }
      });
    </script>
  </body>
</html>
