<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>KISLAP · Filipino Innovations</title>
  <style>
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="m-0 p-0">

<!-- SOLID NAVBAR using #71559F (main purple) and #292F69 (deep navy) as accent -->
<nav class="fixed top-0 left-0 w-full z-50 bg-[#71559F] shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- left: LOGO only (no extra text) -->
      <div class="flex items-center">
        <img src="assets/images/small logo final.png" alt="KISLAP" class="w-12 h-12 rounded-2xl bg-white border-2 border-[#292F69] object-cover shadow-sm">
        <!-- KISLAP title completely removed (logo already represents it) -->
      </div>
      <!-- right: QUIZ button with new color palette -->
      <div>
        <a href="quiz.html" class="inline-block bg-[#292F69] text-white hover:bg-[#1e2349] font-semibold px-5 py-2 rounded-full shadow-md transition duration-200 border border-[#71559F]"> 🚀 QUIZ </a>
      </div>
    </div>
  </div>
</nav>

<!-- FIRST SECTION: fullscreen poster (background image) -->
<section class="relative w-full h-screen mt-16 flex items-center justify-center">
  <div class="absolute inset-0 w-full h-full">
    <img src="assets/images/poster.png" alt="KISLAP poster" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-[#292F69]/10"></div> <!-- overlay with new navy -->
  </div>
</section>

<!-- SECOND SECTION: Quiz info with BIG CENTERED LOGO (only the big logo, title removed) -->
<section id="quiz-details" class="bg-[#F2E9FF] py-16 px-4"> <!-- soft lavender background -->
  <div class="max-w-5xl mx-auto text-center">
    <!-- BIG CENTERED LOGO only (no extra KISLAP heading) -->
    <div class="flex justify-center mb-8">
      <img src="assets/images/big%20logo%20final.png" alt="KISLAP" class="w-500 h-400 object-contain">
    </div>

    <!-- simple descriptor with new colors -->
    <h2 class="text-xl md:text-2xl lg:text-3xl font-semibold text-[#292F69] mb-4 tracking-widest uppercase"> Innovator Personality Quiz </h2>

    <!-- Tagline box with new palette -->
    <div class="bg-white/90 rounded-2xl p-5 md:p-6 mb-8 shadow-lg max-w-2xl mx-auto border border-[#71559F]">
      <p class="text-lg md:text-xl text-[#292F69]"> <span class="font-medium"> Know your innovative personality!</span> </p>
    </div>

    <!-- Stats Cards updated with navy/ purple -->
    <div class="flex flex-wrap justify-center gap-6 md:gap-10 mb-10">
      <div class="bg-white/90 px-6 py-4 rounded-2xl shadow-md border border-[#71559F]">
        <div class="text-3xl md:text-4xl font-bold text-[#292F69]">6</div>
        <div class="text-xs md:text-sm text-[#71559F] uppercase tracking-wider">Personalities</div>
      </div>
      <div class="bg-white/90 px-6 py-4 rounded-2xl shadow-md border border-[#71559F]">
        <div class="text-3xl md:text-4xl font-bold text-[#292F69]">36</div>
        <div class="text-xs md:text-sm text-[#71559F] uppercase tracking-wider">Questions</div>
      </div>
      <div class="bg-white/90 px-6 py-4 rounded-2xl shadow-md border border-[#71559F]">
        <div class="text-3xl md:text-4xl font-bold text-[#292F69]">5min</div>
        <div class="text-xs md:text-sm text-[#71559F] uppercase tracking-wider">To Complete</div>
      </div>
    </div>

    <!-- Quiz button using the two colors (navy + purple) -->
    <div class="mt-12">
      <a href="quiz.html" class="inline-block px-10 py-4 md:px-14 md:py-5 bg-[#292F69] hover:bg-[#1e2349] text-white text-xl md:text-2xl font-bold rounded-full shadow-xl hover:shadow-2xl transform hover:scale-105 transition-all duration-300 border border-[#71559F]"> <span class="mr-3">🚀</span> TAKE THE QUIZ <span class="ml-3">→</span> </a>
    </div>
  </div>
</section>

<!-- Filipino Innovations Section - Dynamically loaded, colors updated -->
<section id="innovations-section" class="bg-[#E6D9FF] py-16 px-4 border-t-4 border-[#292F69]"> <!-- light purple bg with navy border -->
  <div class="max-w-6xl mx-auto">
    <!-- Header with new colors -->
    <div class="text-center mb-12">
      <h2 class="text-4xl md:text-5xl font-bold text-[#292F69] mb-3">Filipino Innovations</h2>
      <p class="text-lg text-[#71559F] max-w-2xl mx-auto">pioneering ideas from the archipelago</p>
    </div>

    <!-- Innovations Container - JS will populate this, but cards now use updated border/ text colors -->
    <div id="innovations-container" class="space-y-8">
      <!-- Innovations loaded dynamically, but the template inside script will reflect #292F69 and #71559F -->
    </div>
  </div>
</section>

<script src="js/data/innovations.js"></script>
<script>
  // Load innovations when page loads – with color classes updated to match #292F69 and #71559F
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('innovations-container');
    if (container && typeof INNOVATIONS !== 'undefined') {
      container.innerHTML = INNOVATIONS.map(innovation => `
        <div class="flex flex-col md:flex-row bg-white rounded-2xl shadow-lg overflow-hidden border border-[#71559F]">
          <!-- Image container - FILLS the space -->
          <div class="md:w-2/5 h-64 md:h-auto bg-[#E6D9FF] overflow-hidden">
            <img src="${innovation.image}" alt="${innovation.alt}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/600x400/71559F/ffffff?text=${innovation.icon}'">
          </div>
          <!-- Text container -->
          <div class="md:w-3/5 p-6 md:p-8 flex flex-col justify-center">
            <h3 class="text-2xl font-bold text-[#292F69] mb-3">${innovation.title}</h3>
            <p class="text-[#71559F] text-base md:text-lg leading-relaxed">${innovation.description}</p>
          </div>
        </div>
      `).join('');
    } else if (container) {
      // fallback demo content using new colors if innovations.js not found
      container.innerHTML = `
        <div class="flex flex-col md:flex-row bg-white rounded-2xl shadow-lg overflow-hidden border border-[#71559F]">
          <div class="md:w-2/5 h-64 md:h-auto bg-[#E6D9FF] overflow-hidden">
            <img src="https://placehold.co/600x400/71559F/ffffff?text=💡" class="w-full h-full object-cover">
          </div>
          <div class="md:w-3/5 p-6 md:p-8 flex flex-col justify-center">
            <h3 class="text-2xl font-bold text-[#292F69] mb-3">Karaoke (Sing-alike system)</h3>
            <p class="text-[#71559F] text-base md:text-lg leading-relaxed">Invented by Roberto del Rosario, the karaoke machine revolutionized global music entertainment.</p>
          </div>
        </div>
        <div class="flex flex-col md:flex-row bg-white rounded-2xl shadow-lg overflow-hidden border border-[#71559F]">
          <div class="md:w-2/5 h-64 md:h-auto bg-[#E6D9FF] overflow-hidden">
            <img src="https://placehold.co/600x400/71559F/ffffff?text=🩺" class="w-full h-full object-cover">
          </div>
          <div class="md:w-3/5 p-6 md:p-8 flex flex-col justify-center">
            <h3 class="text-2xl font-bold text-[#292F69] mb-3">Medical Incubator</h3>
            <p class="text-[#71559F] text-base md:text-lg leading-relaxed">Fe del Mundo's ingenious bamboo incubator addressed the lack of electricity in rural areas.</p>
          </div>
        </div>
      `;
    }
  });
</script>

<!-- ensure body has no leftover margin/padding -->
</body>
</html>
