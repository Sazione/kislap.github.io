<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>KISLAP · Filipino Innovations</title>
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="m-0 p-0">

  <!-- SOLID AMBER NAVBAR with logo AND KISLAP title -->
  <nav class="fixed top-0 left-0 w-full z-50 bg-amber-500 border-b border-amber-400 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- top-left: LOGO + KISLAP TITLE -->
        <div class="flex items-center space-x-2">
          <img src="assets/images/logo.png" alt="KISLAP" class="h-10 w-10 rounded-full border-2 border-white/70 object-cover">
          <span class="text-white font-bold text-xl tracking-wider">KISLAP</span>
        </div>
        
        <!-- top-right: QUIZ button -->
        <div>
          <a href="quiz.html" 
             class="inline-block bg-white text-black hover:bg-amber-50 font-semibold px-5 py-2 rounded-full shadow-md transition duration-200 border border-amber-200">
            🚀 QUIZ
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- FIRST SECTION: fullscreen poster -->
  <section class="relative w-full h-screen mt-16 flex items-center justify-center">
    <div class="absolute inset-0 w-full h-full">
      <img src="assets/images/poster.png" 
           alt="KISLAP poster" 
           class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-black/10"></div>
    </div>
  </section>

  <!-- SECOND SECTION: Quiz info with BIG CENTERED LOGO -->
  <section id="quiz-details" class="bg-amber-50 py-16 px-4">
    <div class="max-w-5xl mx-auto text-center">
      
      <!-- BIG CENTERED LOGO -->
      <div class="flex justify-center mb-6">
        <img src="assets/images/logo.png" 
             alt="KISLAP" 
             class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-amber-300 shadow-xl object-cover">
      </div>

      <!-- KISLAP title -->
      <h1 class="text-5xl md:text-7xl lg:text-8xl font-black mb-2 text-amber-600">
        KISLAP
      </h1>
      
      <h2 class="text-xl md:text-2xl lg:text-3xl font-semibold text-amber-800 mb-4 tracking-widest uppercase">
        Innovator Personality Quiz
      </h2>
      
      <!-- Simple tagline -->
      <div class="bg-white/90 rounded-2xl p-5 md:p-6 mb-8 shadow-lg max-w-2xl mx-auto border border-amber-200">
        <p class="text-lg md:text-xl text-amber-900">
          <span class="font-medium"> *insert tagline here* </span>
        </p>
      </div>
      
      <!-- Stats Cards -->
      <div class="flex flex-wrap justify-center gap-6 md:gap-10 mb-10">
        <div class="bg-white/90 px-6 py-4 rounded-2xl shadow-md border border-amber-300">
          <div class="text-3xl md:text-4xl font-bold text-amber-600">6</div>
          <div class="text-xs md:text-sm text-amber-700 uppercase tracking-wider">Personalities
          </div>
        </div>
        <div class="bg-white/90 px-6 py-4 rounded-2xl shadow-md border border-amber-300">
          <div class="text-3xl md:text-4xl font-bold text-amber-600">36</div>
          <div class="text-xs md:text-sm text-amber-700 uppercase tracking-wider">Questions</div>
        </div>
        <div class="bg-white/90 px-6 py-4 rounded-2xl shadow-md border border-amber-300">
          <div class="text-3xl md:text-4xl font-bold text-amber-600">5min</div>
          <div class="text-xs md:text-sm text-amber-700 uppercase tracking-wider">To Complete</div>
        </div>
      </div>
      
      <!-- Quiz button -->
      <div class="mt-12">
        <a href="quiz.html" 
           class="inline-block px-10 py-4 md:px-14 md:py-5 bg-amber-500 hover:bg-amber-600 text-white text-xl md:text-2xl font-bold rounded-full shadow-xl hover:shadow-2xl transform hover:scale-105 transition-all duration-300">
          <span class="mr-3">🚀</span>
          TAKE THE QUIZ
          <span class="ml-3">→</span>
        </a>
      </div>
      
    </div>
  </section>

  <!-- Filipino Innovations Section - Dynamically loaded -->
  <section id="innovations-section" class="bg-amber-100 py-16 px-4 border-t-4 border-amber-400">
    <div class="max-w-6xl mx-auto">
      
      <!-- Header -->
      <div class="text-center mb-12">
        <h2 class="text-4xl md:text-5xl font-bold text-amber-800 mb-3">Filipino Innovations</h2>
        <p class="text-lg text-amber-700 max-w-2xl mx-auto">*subtext*</p>
      </div>
      
      <!-- Innovations Container - JS will populate this -->
      <div id="innovations-container" class="space-y-8">
        <!-- Innovations loaded dynamically -->
      </div>
      
    </div>
  </section>

  <script src="js/data/innovations.js"></script>
  <script>
    // Load innovations when page loads
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('innovations-container');
      
      if (container && typeof INNOVATIONS !== 'undefined') {
        container.innerHTML = INNOVATIONS.map(innovation => `
          <div class="flex flex-col md:flex-row bg-white rounded-2xl shadow-lg overflow-hidden border border-amber-200">
            <!-- Image container - FILLS the space -->
            <div class="md:w-2/5 h-64 md:h-auto bg-amber-100 overflow-hidden">
              <img src="${innovation.image}" 
                  alt="${innovation.alt}" 
                  class="w-full h-full object-cover"
                  onerror="this.onerror=null; this.src='https://placehold.co/600x400/amber-600/white?text=${innovation.icon}'">
            </div>
            <!-- Text container -->
            <div class="md:w-3/5 p-6 md:p-8 flex flex-col justify-center">
              <h3 class="text-2xl font-bold text-amber-800 mb-3">${innovation.title}</h3>
              <p class="text-amber-700 text-base md:text-lg leading-relaxed">${innovation.description}</p>
            </div>
          </div>
        `).join('');
      }
    });
  </script>

</body>
</html>
